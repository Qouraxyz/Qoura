[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
ast = true
cbor_metadata = false
# Redeem tests prove with the site's TypeScript prover (test/ffi/redeem.mts).
ffi = true
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
robinhood = "https://robinhood.drpc.org"

[lint]
lint_on_build = false
